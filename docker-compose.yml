# Entorno de DESARROLLO. Para producción usa docker-compose.prod.yml (sin phpMyAdmin ni Mailpit).
name: orbita

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  FRONTEND_URL: ${FRONTEND_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  SECRET_KEY: ${SECRET_KEY}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
  REDIS_URL: ${REDIS_URL}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM: ${SMTP_FROM}
  SMTP_TLS: ${SMTP_TLS:-false}
  SEED_DEMO: ${SEED_DEMO:-false}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql        # volumen persistente: nunca se borra automáticamente
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  seaweedfs:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.iam=false
      - -s3.concurrentUploadLimitMB=64
      - -s3.readerCacheSizeMB=64
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Configura S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Configura S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-orbita-attachments}
      GOMEMLIMIT: 512MiB
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 4
          --aws-sigv4 'aws:amz:us-east-1:s3'
          --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY"
          --head "http://127.0.0.1:8333/$$S3_BUCKET" >/dev/null
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 0.5

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 30

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-env
    entrypoint: []
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"

  # ── Sólo desarrollo ────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_ABSOLUTE_URI: http://localhost:8080/
    depends_on:
      mysql: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:80"              # ligado a localhost: nunca expuesto a la red

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  mysql_data:
  redis_data:
  seaweedfs_data:
