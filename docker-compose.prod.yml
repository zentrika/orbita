name: orbita-prod

x-backend-env: &backend-env
  APP_ENV: production
  FRONTEND_URL: ${FRONTEND_URL:?}
  CORS_ORIGINS: ${CORS_ORIGINS:?}
  SECRET_KEY: ${SECRET_KEY:?}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
  COOKIE_SECURE: "true"

  DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4

  REDIS_URL: redis://redis:6379/0

  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_BUCKET: ${S3_BUCKET:-orbita-attachments}
  S3_REGION: ${S3_REGION:-us-east-1}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}

  SMTP_HOST: ${SMTP_HOST:?}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM: ${SMTP_FROM:?}
  SMTP_TLS: ${SMTP_TLS:-true}

  SEED_DEMO: "false"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  redis:
    image: redis:7-alpine
    container_name: orbita-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

    mem_limit: 512m
    cpus: 0.25

    networks:
      - orbita_internal

    logging: *default-logging

  seaweedfs:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.iam=false
      - -s3.concurrentUploadLimitMB=64
      - -s3.readerCacheSizeMB=64
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Configura S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Configura S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-orbita-attachments}
      GOMEMLIMIT: 512MiB
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 4
          --aws-sigv4 'aws:amz:us-east-1:s3'
          --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY"
          --head "http://127.0.0.1:8333/$$S3_BUCKET" >/dev/null
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 0.5
    networks: [orbita_internal]
    logging: *default-logging

  backend:
    image: zentrika/orbita-backend:local
    build:
      context: ./backend

    container_name: orbita-backend
    restart: unless-stopped

    environment: *backend-env

    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"

    mem_limit: 1g
    cpus: 1.0

    networks:
      - orbita_internal
      - zentrika_network

    logging: *default-logging

  worker:
    image: zentrika/orbita-backend:local
    container_name: orbita-worker
    restart: unless-stopped

    environment: *backend-env

    entrypoint: []

    command:
      - python
      - -m
      - app.worker

    depends_on:
      - backend

    mem_limit: 512m
    cpus: 0.25

    networks:
      - orbita_internal
      - zentrika_network

    logging: *default-logging

volumes:
  redis_data:
  seaweedfs_data:

networks:
  orbita_internal:
    driver: bridge

  zentrika_network:
    external: true