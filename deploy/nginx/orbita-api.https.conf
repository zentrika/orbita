map $http_upgrade $orbita_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.orbita.zentrika.tech;

    ssl_certificate /etc/letsencrypt/live/api.orbita.zentrika.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orbita.zentrika.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OrbitaTLS:10m;

    client_max_body_size 26m;
    client_body_timeout 30s;
    server_tokens off;
    access_log off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host api.orbita.zentrika.tech;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $orbita_connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }
}
