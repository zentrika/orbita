server {
    listen 80;
    listen [::]:80;
    server_name api.orbita.zentrika.tech;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://api.orbita.zentrika.tech$request_uri;
    }
}
